    io.kompose.service: cast-service
  name: cast-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: cast-service

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: movie-service
  name: movie-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: movie-service

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: nginx
  name: nginx
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: nginx
