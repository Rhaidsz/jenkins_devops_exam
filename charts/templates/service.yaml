---
apiVersion: v1
kind: Service
metadata:
  name: cast-db
spec:
  selector:
    io.kompose.service: cast-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: movie-db
spec:
  selector:
    io.kompose.service: movie-db
  ports:
    - port: 5432
      targetPort: 5432

---
